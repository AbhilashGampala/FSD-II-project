# Render Infrastructure as Code Blueprint for VIT Campus Placement Tracker
# Vishnu Institute of Technology, Bhimavaram, AP

services:
  # Backend Web Service (Node.js + Express)
  - type: web
    name: vit-placement-tracker-server
    env: node
    rootDir: server
    plan: free
    buildCommand: npm install
    startCommand: node src/index.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: OTP_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: DEMO_MODE
        value: "true"

  # Frontend Static Site (React + Vite + Tailwind)
  - type: static
    name: vit-placement-tracker-client
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
